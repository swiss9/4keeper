<!DOCTYPE html>
<html lang="en" class="bg-[#09090b]">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#09090b" />
  <title>4Keeper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: 'var(--c-bg)',
            bar: 'var(--c-surface)',
            line: 'var(--c-border)',
            muted: 'var(--c-muted)',
            fg: 'var(--c-text)'
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <script>
    (function () {
      var t = localStorage.getItem('theme');
      if (t !== 'light' && t !== 'amoled' && t !== 'dark') t = 'dark';
      document.documentElement.classList.add('theme-' + t);
    })();
  </script>
  <style>
    :root, .theme-dark {
      --c-bg: #09090b;
      --c-surface: #18181b;
      --c-border: #27272a;
      --c-text: #ffffff;
      --c-muted: #a1a1aa;
    }
    .theme-light {
      --c-bg: #ffffff;
      --c-surface: #f4f4f5;
      --c-border: #e4e4e7;
      --c-text: #09090b;
      --c-muted: #71717a;
    }
    .theme-amoled {
      --c-bg: #000000;
      --c-surface: #0a0a0a;
      --c-border: #1a1a1a;
      --c-text: #ffffff;
      --c-muted: #a1a1aa;
    }
    html, body { height: 100%; }
    body {
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    input { caret-color: var(--c-text); }
    input::selection { background: var(--c-text); color: var(--c-bg); }
    .spin { animation: spin 700ms linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .tap { transition: opacity 120ms ease, transform 120ms ease, background-color 150ms ease; }
    .tap:active { opacity: 0.6; }
    .menu-open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
    #startScreen { transition: opacity 220ms ease; }
    #settingsBackdrop { transition: opacity 150ms ease; }
    #settingsPanel { transition: opacity 150ms ease, transform 150ms ease; }
  </style>
</head>
<body class="flex h-[100dvh] w-full flex-col overflow-hidden bg-ink font-sans text-fg antialiased">

  <header class="relative shrink-0 border-b border-line bg-bar">
    <div class="flex items-center gap-1.5 px-3 pb-2.5 pt-[calc(env(safe-area-inset-top)+10px)]">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="234 227 777 777"
        fill="none"
        aria-label="4Keeper"
        class="shrink-0 self-center"
      >
        <!-- Grey shield outline -->
        <path
          fill="#99989E"
          fill-rule="evenodd"
          d="
            M310 227
            H936
            V736
            L623 1004
            L309 736
            Z

            M360 273
            V715
            L623 939
            L889 715
            V273
            Z
          "
        />

        <!-- White number 4 with downward arrow -->
        <path
          fill="#FFFFFF"
          fill-rule="evenodd"
          d="
            M619 322
            L407 550
            V615
            H641
            L642 706
            H568
            L680 834

            L492 557

        />
      </svg>
      <button id="backBtn" aria-label="Back" disabled class="tap grid h-10 w-10 shrink-0 place-items-center text-muted hover:text-fg disabled:opacity-40">
        <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
      </button>

      <div class="flex min-w-0 flex-1 items-center gap-2 rounded-full bg-[#27272a] px-5 py-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0 text-[#a1a1aa]">
          <rect x="5" y="11" width="14" height="10" rx="2" />
          <path d="M8 11V7a4 4 0 0 1 8 0v4" />
        </svg>
        <input
          id="urlInput"
          type="url"
          inputmode="url"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="Search or enter address"
          class="h-6 w-full min-w-0 bg-transparent text-[14px] font-normal text-fg outline-none placeholder:text-[#a1a1aa]"
        />
      </div>

      <button id="refreshBtn" aria-label="Refresh" class="tap grid h-10 w-10 shrink-0 place-items-center text-muted hover:text-fg">
        <svg id="refreshIcon" xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-3.2-6.9" />
          <path d="M21 3v6h-6" />
        </svg>
      </button>
    </div>
    <div id="loadBar" class="absolute bottom-0 left-0 h-[2px] w-0 bg-fg transition-[width] duration-200 ease-out"></div>

    <div id="suggestionsDropdown" class="absolute left-0 right-0 top-full z-50 hidden border-b border-line bg-bar shadow-[0_16px_48px_rgba(0,0,0,0.6)]">
      <div id="suggestionsList" class="max-h-64 overflow-y-auto"></div>
    </div>
  </header>

            H568

  <div id="menuPanel" class="fixed bottom-[calc(env(safe-area-inset-bottom)+78px)] right-3 z-40 w-56 origin-bottom-right rounded-2xl border border-line bg-bar p-1.5 opacity-0 shadow-[0_16px_48px_rgba(0,0,0,0.6)] transition-all duration-150 ease-out pointer-events-none scale-95 translate-y-1">
    <button class="tap flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left text-[14px] font-medium text-fg active:bg-line">
      <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-muted">

      <span class="text-[10px] font-semibold uppercase tracking-wider text-muted/60">Phase 2</span>
    </button>
    <button class="tap flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left text-[14px] font-medium text-fg active:bg-line">
      <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-muted">

        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" />

  <div id="settingsBackdrop" class="pointer-events-none fixed inset-0 z-50 bg-black/70 opacity-0"></div>

  <div id="settingsPanel" class="pointer-events-none fixed inset-x-3 bottom-[calc(env(safe-area-inset-bottom)+12px)] z-[60] max-h-[80dvh] origin-bottom scale-95 overflow-y-auto border border-line bg-bar opacity-0 transition-all duration-150 ease-out sm:inset-x-auto sm:left-1/2 sm:w-[360px] sm:-translate-x-1/2">
    <div class="flex items-center justify-between border-b border-line px-4 py-3">
      <h2 class="text-[14px] font-semibold uppercase tracking-wider text-fg">Settings</h2>
      <button id="settingsCloseBtn" aria-label="Close settings" class="tap grid h-8 w-8 place-items-center border border-line text-muted hover:text-fg">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </button>
    </div>

    <div class="border-b border-line px-4 py-3">
      <label for="searchEngineSelect" class="mb-2 block text-[11px] font-semibold uppercase tracking-wider text-muted">Search Engine</label>
      <select id="searchEngineSelect" class="h-10 w-full border border-line bg-ink px-3 text-[14px] font-medium text-fg outline-none">
        <option value="duckduckgo">DuckDuckGo</option>
        <option value="google">Google</option>
        <option value="brave">Brave</option>
        <option value="bing">Bing</option>

    <div class="border-b border-line px-4 py-3">
      <span class="mb-2 block text-[11px] font-semibold uppercase tracking-wider text-muted">App Theme</span>
      <div id="themeSelector" class="grid grid-cols-3 gap-0 border border-line">
        <button data-theme="light" class="tap h-10 border-r border-line text-[13px] font-medium text-fg">Light</button>
        <button data-theme="dark" class="tap h-10 border-r border-line text-[13px] font-medium text-fg">Dark</button>
        <button data-theme="amoled" class="tap h-10 text-[13px] font-medium text-fg">AMOLED</button>

    </div>

    <div class="border-b border-line px-4 py-3">
      <div class="flex items-center justify-between">
        <div class="min-w-0 pr-3">
          <span class="block text-[14px] font-medium text-fg">Web Dark Mode</span>
          <span class="block text-[11px] text-muted">Force websites to render in dark mode</span>
        </div>
        <label class="relative inline-block shrink-0 cursor-pointer">
          <input id="webDarkModeToggle" type="checkbox" class="peer sr-only" />
          <span class="block h-6 w-11 border border-line bg-ink"></span>
          <span class="pointer-events-none absolute left-[3px] top-[3px] h-4 w-4 bg-muted transition-transform duration-100 peer-checked:translate-x-5 peer-checked:bg-fg"></span>
        </label>
      </div>
    </div>

    <div class="border-b border-line px-4 py-3">
      <div class="flex items-center justify-between">
        <div class="min-w-0 pr-3">
          <span class="block text-[14px] font-medium text-fg">Search Suggestions</span>
          <span class="block text-[11px] text-muted">Show query suggestions while typing</span>
        </div>
        <label class="relative inline-block shrink-0 cursor-pointer">
          <input id="searchSuggestionsToggle" type="checkbox" class="peer sr-only" />
          <span class="block h-6 w-11 border border-line bg-ink"></span>
          <span class="pointer-events-none absolute left-[3px] top-[3px] h-4 w-4 bg-muted transition-transform duration-100 peer-checked:translate-x-5 peer-checked:bg-fg"></span>
        </label>
      </div>
    </div>

    <div class="border-b border-line px-4 py-3">
      <div class="flex items-center justify-between">
        <div class="min-w-0 pr-3">
          <span class="block text-[14px] font-medium text-fg">Ad-Blocker</span>
          <span class="block text-[11px] text-muted">Block ads and trackers (coming soon)</span>
        </div>
        <label class="relative inline-block shrink-0 cursor-pointer">
          <input id="adBlockerToggle" type="checkbox" class="peer sr-only" />
          <span class="block h-6 w-11 border border-line bg-ink"></span>
          <span class="pointer-events-none absolute left-[3px] top-[3px] h-4 w-4 bg-muted transition-transform duration-100 peer-checked:translate-x-5 peer-checked:bg-fg"></span>
        </label>
      </div>
    </div>

    <div class="border-b border-line px-4 py-3">

        id="homePageInput"
        type="url"
        inputmode="url"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        placeholder="https://duckduckgo.com"
        class="h-10 w-full border border-line bg-ink px-3 text-[14px] font-medium text-fg outline-none placeholder:text-muted"
      />

    <div class="px-4 py-3">
      <button id="clearDataBtn" class="tap h-11 w-full border border-red-600 text-[13px] font-semibold uppercase tracking-wider text-red-600 hover:bg-red-600/10">
        Clear History, Cache &amp; Cookies
      </button>
    </div>

  <footer class="relative shrink-0 border-t border-line bg-bar">
    <div class="grid grid-cols-5 px-2 pb-[calc(env(safe-area-inset-bottom)+8px)] pt-1.5">
      <button id="backNavBtn" aria-label="Back" disabled class="tap flex h-12 items-center justify-center text-muted hover:text-fg disabled:opacity-40">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 19l-7-7 7-7" />
        </svg>
      </button>
      <button id="forwardBtn" aria-label="Forward" disabled class="tap flex h-12 items-center justify-center text-muted hover:text-fg disabled:opacity-40">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="m9 5 7 7-7 7" />
        </svg>
      </button>
      <button id="homeBtn" aria-label="Home" class="tap flex h-12 items-center justify-center text-muted hover:text-fg">
        <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 10 9-7 9 7" />
          <path d="M5 9v12h14V9" />
        </svg>
      </button>
      <button id="tabsBtn" aria-label="Tabs" class="tap relative flex h-12 items-center justify-center text-muted hover:text-fg">
        <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="3" width="14" height="18" rx="2" />
          <path d="M9 3h6" />
        </svg>
        <span class="absolute right-1.5 top-1.5 grid h-[15px] min-w-[15px] place-items-center rounded-full bg-line px-1 text-[9px] font-semibold leading-none text-fg">0</span>
      </button>
      <button id="menuBtn" aria-label="Menu" aria-expanded="false" class="tap flex h-12 items-center justify-center text-muted hover:text-fg">
        <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="5" r="1.8" />
          <circle cx="12" cy="12" r="1.8" />
          <circle cx="12" cy="19" r="1.8" />
        </svg>
      </button>
    </div>
  </footer>

  <script>
    const menuBtn = document.getElementById('menuBtn');
    const menuPanel = document.getElementById('menuPanel');
    const menuBackdrop = document.getElementById('menuBackdrop');
    const refreshIcon = document.getElementById('refreshIcon');
    const urlInput = document.getElementById('urlInput');
    const browserContainer = document.getElementById('browser-container');
    const startScreen = document.getElementById('startScreen');
    const loadBar = document.getElementById('loadBar');
    const backBtn = document.getElementById('backBtn');
    const backNavBtn = document.getElementById('backNavBtn');
    const forwardBtn = document.getElementById('forwardBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsBackdrop = document.getElementById('settingsBackdrop');
    const settingsPanel = document.getElementById('settingsPanel');
    const settingsCloseBtn = document.getElementById('settingsCloseBtn');
    const searchEngineSelect = document.getElementById('searchEngineSelect');
    const themeSelector = document.getElementById('themeSelector');
    const webDarkModeToggle = document.getElementById('webDarkModeToggle');
    const searchSuggestionsToggle = document.getElementById('searchSuggestionsToggle');
    const adBlockerToggle = document.getElementById('adBlockerToggle');
    const homePageInput = document.getElementById('homePageInput');
    const clearDataBtn = document.getElementById('clearDataBtn');
    const suggestionsDropdown = document.getElementById('suggestionsDropdown');
    const suggestionsList = document.getElementById('suggestionsList');

    const SEARCH_ENGINES = {
      duckduckgo: 'https://duckduckgo.com/?q=',
      google: 'https://www.google.com/search?q=',
      brave: 'https://search.brave.com/search?q=',
      bing: 'https://www.bing.com/search?q='
    };

    const SUGGEST_APIS = {
      duckduckgo: (q) => `https://duckduckgo.com/ac/?q=${encodeURIComponent(q)}&type=list`,
      google: (q) => `https://suggestqueries.google.com/complete/search?client=firefox&q=${encodeURIComponent(q)}`,
      brave: (q) => `https://search.brave.com/api/suggest?q=${encodeURIComponent(q)}`
    };

    let hasPage = false;
    let menuOpen = false;
    let settingsOpen = false;
    let suggestTimer = null;
    let suggestRequestId = 0;

    function getPlugin() {
      return window.Capacitor?.Plugins?.EmbeddedWebView || null;
    }

    function setNativeWebViewVisible(visible) {
      const plugin = getPlugin();
      if (!plugin) return;
      const setter = plugin.setVisibility || plugin.setWebViewVisibility || plugin.setVisible;
      if (setter) setter.call(plugin, { visible }).catch(() => {});
    }

    function syncWebViewVisibility() {
      if (menuOpen || settingsOpen) {
        setNativeWebViewVisible(false);
      } else if (hasPage) {
        setNativeWebViewVisible(true);
      }
    }

    function getBounds() {
      const rect = browserContainer.getBoundingClientRect();
      return {
        x: Math.round(rect.left),
        y: Math.round(rect.top),
        width: Math.round(rect.width),
        height: Math.round(rect.height)
      };
    }

    function setNav(canBack, canForward) {
      backBtn.disabled = !canBack;
      backNavBtn.disabled = !canBack;
      forwardBtn.disabled = !canForward;
    }

    function startLoading() {
      refreshIcon.classList.add('spin');
      loadBar.style.width = '35%';
    }

    function stopLoading() {
      refreshIcon.classList.remove('spin');
      loadBar.style.width = '100%';
      setTimeout(() => { loadBar.style.width = '0'; }, 260);
    }

    function getSearchEngine() {
      const engine = localStorage.getItem('searchEngine');
      return SEARCH_ENGINES[engine] ? engine : 'duckduckgo';
    }

    function formatUrl(input) {
      let str = input.trim();
      if (!str) return null;

      // If it's a valid URL or contains a dot, prepend https:// if missing
      if (str.includes('.') || str.startsWith('localhost')) {
        if (!str.startsWith('http://') && !str.startsWith('https://')) {
          return 'https://' + str;
        }
        return str;
      }

      // Otherwise, it's a search query using the selected search engine
      return SEARCH_ENGINES[getSearchEngine()] + encodeURIComponent(str);
    }

    function applyTheme(theme, persist) {
      const t = ['dark', 'light', 'amoled'].includes(theme) ? theme : 'dark';
      document.documentElement.classList.remove('theme-dark', 'theme-light', 'theme-amoled');
      document.documentElement.classList.add('theme-' + t);
      if (persist) localStorage.setItem('theme', t);
      themeSelector.querySelectorAll('button[data-theme]').forEach((btn) => {
        const active = btn.dataset.theme === t;
        btn.classList.toggle('bg-line', active);
        btn.classList.toggle('font-semibold', active);
      });
      const styles = getComputedStyle(document.documentElement);
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = styles.getPropertyValue('--c-bg').trim();
    }

    function isWebDarkMode() {
      return localStorage.getItem('webDarkMode') === 'on';
    }

    function setWebDarkMode(enabled, persist) {
      if (persist) localStorage.setItem('webDarkMode', enabled ? 'on' : 'off');
      webDarkModeToggle.checked = enabled;
      const plugin = getPlugin();
      if (plugin) plugin.setWebDarkMode({ enabled }).catch(() => {});
    }

    function isSuggestionsOn() {
      return localStorage.getItem('searchSuggestions') === 'on';
    }

    function setSearchSuggestions(enabled, persist) {
      if (persist) localStorage.setItem('searchSuggestions', enabled ? 'on' : 'off');
      searchSuggestionsToggle.checked = enabled;
      if (!enabled) hideSuggestions();
    }

    function isAdBlockerOn() {
      return localStorage.getItem('adBlocker') === 'on';
    }

    function setAdBlocker(enabled, persist) {
      if (persist) localStorage.setItem('adBlocker', enabled ? 'on' : 'off');
      adBlockerToggle.checked = enabled;
    }

    function getHomePage() {
      const page = (localStorage.getItem('homePage') || '').trim();
      return page || 'https://duckduckgo.com';
    }

    function hideSuggestions() {
      clearTimeout(suggestTimer);
      suggestTimer = null;
      suggestRequestId++;
      suggestionsDropdown.classList.add('hidden');
      suggestionsList.innerHTML = '';
    }

    function parseSuggestions(data, engine) {
      if (engine === 'brave') {
        if (data && Array.isArray(data.q)) return data.q.filter((x) => typeof x === 'string');
        if (data && Array.isArray(data.results)) return data.results.map((r) => r.query || r.q).filter(Boolean);
        return [];
      }
      if (Array.isArray(data) && Array.isArray(data[1])) return data[1];
      if (Array.isArray(data)) return data.map((x) => (typeof x === 'string' ? x : x && x.phrase)).filter(Boolean);
      return [];
    }

    async function fetchSuggestions(query) {
      const engine = getSearchEngine();
      const endpoint = SUGGEST_APIS[engine];
      if (!endpoint) { hideSuggestions(); return; }

      const requestId = ++suggestRequestId;
      try {
        const response = await fetch(endpoint(query));
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();
        if (requestId !== suggestRequestId) return;
        const items = parseSuggestions(data, engine).slice(0, 8);
        if (!items.length) { hideSuggestions(); return; }

        suggestionsList.innerHTML = '';
        items.forEach((text) => {
          const item = document.createElement('button');
          item.type = 'button';
          item.className = 'tap flex w-full items-center gap-3 border-b border-line px-4 py-3 text-left text-[14px] font-normal text-fg hover:bg-line/40 last:border-b-0';
          const icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          icon.setAttribute('viewBox', '0 0 24 24');
          icon.setAttribute('width', '15');
          icon.setAttribute('height', '15');
          icon.setAttribute('fill', 'none');
          icon.setAttribute('stroke', 'currentColor');
          icon.setAttribute('stroke-width', '2');
          icon.setAttribute('stroke-linecap', 'round');
          icon.setAttribute('stroke-linejoin', 'round');
          icon.classList.add('shrink-0', 'text-muted');
          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('d', 'M12 3v12m-5-5 5 5 5-5M5 21h14');
          icon.appendChild(path);
          const label = document.createElement('span');
          label.className = 'min-w-0 flex-1 truncate';
          label.textContent = text;
          item.appendChild(icon);
          item.appendChild(label);
          item.addEventListener('click', () => {
            hideSuggestions();
            navigate(text);
          });
          suggestionsList.appendChild(item);
        });
        suggestionsDropdown.classList.remove('hidden');
      } catch (error) {
        if (requestId === suggestRequestId) hideSuggestions();
      }
    }

    async function mountWebView() {
      const plugin = getPlugin();
      if (!plugin) return;
      await plugin.mount(getBounds());
    }

    async function syncNav() {
      const plugin = getPlugin();
      if (!plugin) {
        setNav(false, false);
        return;
      }
      try {
        const state = await plugin.getNavigationState();
        setNav(!!state.canGoBack, !!state.canGoForward);
      } catch (error) {
        setNav(false, false);
      }
    }

    async function navigate(raw) {
      hideSuggestions();
      const url = formatUrl(raw);
      if (!url) return;

      urlInput.blur();
      startScreen.classList.add('opacity-0', 'pointer-events-none');
      startLoading();

      const plugin = getPlugin();
      if (!plugin) {
        stopLoading();
        console.warn('Native WebView is only available inside the Android app.');
        return;
      }

      try {
        await mountWebView();
        await plugin.setWebDarkMode({ enabled: isWebDarkMode() }).catch(() => {});
        await plugin.loadUrl({ url });
        hasPage = true;
        syncNav();
      } catch (error) {
        console.error('Failed to load URL', error);
        stopLoading();
      }
    }

    async function goBack() {
      const plugin = getPlugin();
      if (!plugin || !hasPage) return;
      try {
        await plugin.goBack();
        setTimeout(syncNav, 350);
      } catch (error) {
        console.error(error);
      }
    }

    async function goForward() {
      const plugin = getPlugin();
      if (!plugin || !hasPage) return;
      try {
        await plugin.goForward();
        setTimeout(syncNav, 350);
      } catch (error) {
        console.error(error);
      }
    }

    async function goHome() {
      const page = getHomePage();
      if (page) {
        await navigate(page);
        return;
      }
      const plugin = getPlugin();
      hasPage = false;
      urlInput.value = '';
      document.title = '4Keeper';
      startScreen.classList.remove('opacity-0', 'pointer-events-none');
      setNav(false, false);
      if (plugin) {
        try {
          const setter = plugin.setVisibility || plugin.setWebViewVisibility || plugin.setVisible;
          if (setter) await setter.call(plugin, { visible: false });
        } catch (error) {
          console.error(error);
        }
      }
    }

    function setMenu(open) {
      menuOpen = open;
      menuPanel.classList.toggle('menu-open', open);
      menuBtn.setAttribute('aria-expanded', String(open));
      menuBackdrop.classList.toggle('pointer-events-auto', open);
      syncWebViewVisibility();
    }

    menuBtn.addEventListener('click', () => setMenu(!menuOpen));
    menuBackdrop.addEventListener('click', () => setMenu(false));
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        if (settingsOpen) setSettings(false);
        else setMenu(false);
      }
    });

    function setSettings(open) {
      settingsOpen = open;
      settingsBackdrop.classList.toggle('opacity-0', !open);
      settingsBackdrop.classList.toggle('pointer-events-auto', open);
      settingsPanel.classList.toggle('opacity-0', !open);
      settingsPanel.classList.toggle('scale-95', !open);
      settingsPanel.classList.toggle('pointer-events-none', !open);
      if (open) setMenu(false);
      syncWebViewVisibility();
    }

    settingsBtn.addEventListener('click', () => setSettings(true));
    settingsCloseBtn.addEventListener('click', () => setSettings(false));
    settingsBackdrop.addEventListener('click', () => setSettings(false));

    searchEngineSelect.value = getSearchEngine();
    searchEngineSelect.addEventListener('change', () => {
      localStorage.setItem('searchEngine', searchEngineSelect.value);
    });

    applyTheme(localStorage.getItem('theme') || 'dark', false);
    themeSelector.addEventListener('click', (event) => {
      const btn = event.target.closest('button[data-theme]');
      if (btn) applyTheme(btn.dataset.theme, true);
    });

    webDarkModeToggle.checked = isWebDarkMode();
    webDarkModeToggle.addEventListener('change', () => {
      setWebDarkMode(webDarkModeToggle.checked, true);
    });

    searchSuggestionsToggle.checked = isSuggestionsOn();
    searchSuggestionsToggle.addEventListener('change', () => {
      setSearchSuggestions(searchSuggestionsToggle.checked, true);
    });

    adBlockerToggle.checked = isAdBlockerOn();
    adBlockerToggle.addEventListener('change', () => {
      setAdBlocker(adBlockerToggle.checked, true);
    });

    homePageInput.value = getHomePage();
    homePageInput.addEventListener('change', () => {
      const page = homePageInput.value.trim();
      localStorage.setItem('homePage', page || 'https://duckduckgo.com');
    });

    clearDataBtn.addEventListener('click', async () => {
      const plugin = getPlugin();
      if (!plugin) return;
      try {
        await plugin.clearBrowsingData();
      } catch (error) {
        console.error('Failed to clear browsing data', error);
      }
    });

    document.querySelectorAll('#menuPanel button').forEach((item) => {
      item.addEventListener('click', () => setMenu(false));
    });

    urlInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        navigate(urlInput.value);
      }
    });
    urlInput.addEventListener('focus', () => {
      requestAnimationFrame(() => {
        urlInput.select();
        urlInput.setSelectionRange(0, urlInput.value.length);
      });
    });
    urlInput.addEventListener('input', () => {
      const query = urlInput.value.trim();
      clearTimeout(suggestTimer);
      if (!isSuggestionsOn() || !query || query.includes('.') || query.startsWith('localhost')) {
        hideSuggestions();
        return;
      }
      suggestTimer = setTimeout(() => fetchSuggestions(query), 300);
    });
    urlInput.addEventListener('blur', () => {
      setTimeout(() => {
        if (!urlInput.matches(':focus')) hideSuggestions();
      }, 150);
    });

    document.getElementById('refreshBtn').addEventListener('click', async () => {
      if (urlInput.value.trim()) {
        navigate(urlInput.value);
        return;
      }
      const plugin = getPlugin();
      if (plugin && hasPage) {
        startLoading();
        try {
          await plugin.reload();
        } catch (error) {
          console.error(error);
          stopLoading();
        }
      }
    });

    backBtn.addEventListener('click', goBack);
    backNavBtn.addEventListener('click', goBack);
    forwardBtn.addEventListener('click', goForward);
    document.getElementById('homeBtn').addEventListener('click', goHome);

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        const plugin = getPlugin();
        if (plugin && hasPage && !menuOpen && !settingsOpen) {
          plugin.mount(getBounds()).catch(() => {});
        }
      }, 180);
    });

    const plugin = getPlugin();
    if (plugin) {
      plugin.addListener('pageLoaded', (state) => {
        stopLoading();
        hasPage = true;
        if (state && state.url && /^https?:\/\//i.test(state.url) && document.activeElement !== urlInput) {
          urlInput.value = state.url;
        }
        startScreen.classList.add('opacity-0', 'pointer-events-none');
        setNav(!!state?.canGoBack, !!state?.canGoForward);
        syncWebViewVisibility();
      });

      plugin.addListener('pageStarted', () => startLoading());

      plugin.addListener('loadProgress', (state) => {
        if (!state || typeof state.progress !== 'number') return;
        loadBar.style.width = `${Math.min(100, Math.max(5, state.progress))}%`;
      });

      plugin.addListener('titleChanged', (state) => {
        if (state && state.title) document.title = state.title;
      });

      plugin.addListener('pageError', (state) => {
        stopLoading();
        console.error('Page error', state);
      });
    }

    syncNav();
  </script>
</body>
</html>
