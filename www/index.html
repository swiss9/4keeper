<!DOCTYPE html>
<html lang="en" data-theme="dark" data-density="comfortable">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <title>4Keeper</title>
  <link rel="stylesheet" href="styles.css" />
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('4k.settings');
        var stored = raw ? JSON.parse(raw) : {};
        var theme = stored.theme || 'system';
        if (theme === 'system' || theme === 'auto') {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-density', stored.density === 'compact' ? 'compact' : 'comfortable');
      } catch (error) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>
  <div id="app" class="app">
    <header id="toolbar" class="toolbar">
      <div class="toolbar-main">
        <button id="siteInfoBtn" class="icon-btn" type="button" aria-label="Site information">
          <span id="securityIcon"></span>
        </button>
        <div class="omnibox">
          <input
            id="urlInput"
            type="text"
            inputmode="url"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            enterkeyhint="go"
            placeholder="Search or enter address"
            aria-label="Address and search bar"
          />
          <button id="clearUrlBtn" class="omnibox-action hidden" type="button" aria-label="Clear address">
            <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <button id="reloadBtn" class="icon-btn" type="button" aria-label="Reload page">
          <svg id="reloadIcon" class="icon" viewBox="0 0 24 24">
            <path d="M20 11a8 8 0 1 0-2.4 6.4"/>
            <path d="M20 4v7h-7"/>
          </svg>
          <svg id="stopIcon" class="icon hidden" viewBox="0 0 24 24">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div id="progressBar" class="progress-bar"></div>
      <div id="suggestions" class="suggestions hidden" role="listbox" aria-label="Suggestions">
        <div id="suggestionsList"></div>
      </div>
    </header>

    <main id="browserContainer" class="browser">
      <img id="webviewSnapshot" class="webview-snapshot hidden" alt="" aria-hidden="true" />
      <div id="startScreen" class="start-screen">
        <svg class="start-logo" xmlns="http://www.w3.org/2000/svg" viewBox="234 227 777 777" fill="none" aria-hidden="true">
          <path fill="#99989E" fill-rule="evenodd" d="M310 227H936V736L623 1004L309 736Z M360 273V715L623 939L889 715V273Z"/>
          <path fill="#FFFFFF" fill-rule="evenodd" d="M619 322L407 550V615H641L642 706H568L680 834L799 707L733 705V617L797 615V557L733 555V323H734Z M641 392L642 556L492 557Z"/>
        </svg>
        <div class="start-wordmark">4Keeper</div>
        <div class="start-hint">Fast, private, yours.</div>
      </div>
    </main>

    <nav id="bottomBar" class="bottom-bar" aria-label="Browser navigation">
      <button id="backBtn" class="nav-btn" type="button" aria-label="Back" disabled>
        <svg class="icon" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
      </button>
      <button id="forwardBtn" class="nav-btn" type="button" aria-label="Forward" disabled>
        <svg class="icon" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg>
      </button>
      <button id="homeBtn" class="nav-btn" type="button" aria-label="Home">
        <svg class="icon" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7"/><path d="M5 9v12h14V9"/></svg>
      </button>
      <button id="tabsBtn" class="nav-btn" type="button" aria-label="Tabs" aria-haspopup="dialog">
        <svg class="icon" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3h6"/></svg>
        <span id="tabsBadge" class="nav-badge">1</span>
      </button>
      <button id="menuBtn" class="nav-btn" type="button" aria-label="Menu" aria-haspopup="dialog" aria-expanded="false">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.7" fill="currentColor" stroke="none"/></svg>
      </button>
    </nav>

    <!-- Tab manager -->
    <div id="tabSheetBackdrop" class="backdrop"></div>
    <section id="tabSheet" class="sheet sheet-tall" role="dialog" aria-modal="true" aria-label="Tabs" aria-hidden="true">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <h2 class="sheet-title">Tabs</h2>
        <span id="tabSheetCount" class="count-chip" aria-label="Open tabs">0</span>
        <div class="sheet-actions">
          <button id="newTabBtn" class="icon-btn" type="button" aria-label="New tab">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button id="closeAllTabsBtn" class="icon-btn" type="button" aria-label="Close all tabs" disabled>
            <svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
          </button>
          <button id="closeTabSheetBtn" class="icon-btn" type="button" aria-label="Close tab manager">
            <svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
      </div>
      <div class="sheet-body">
        <div id="tabsList" class="tab-grid"></div>
        <div id="tabsEmpty" class="empty-state hidden">
          <div class="empty-icon">
            <svg class="icon" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3h6"/></svg>
          </div>
          <div class="empty-title">No open tabs</div>
          <div class="empty-desc">Open a new tab to start browsing.</div>
          <button id="tabsEmptyNewTabBtn" class="btn btn-primary empty-action" type="button">New tab</button>
        </div>
      </div>
    </section>

    <!-- Menu -->
    <div id="menuBackdrop" class="backdrop"></div>
    <section id="menuSheet" class="sheet" role="dialog" aria-modal="true" aria-label="Menu" aria-hidden="true">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <h2 class="sheet-title">Menu</h2>
        <div class="sheet-actions">
          <button id="closeMenuBtn" class="icon-btn" type="button" aria-label="Close menu">
            <svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
      </div>
      <div class="sheet-body flush">
        <div class="menu-list">
          <button id="menuNewTabBtn" class="menu-row" type="button">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            <span class="menu-label">New tab</span>
          </button>
          <button id="menuBookmarkBtn" class="menu-row" type="button">
            <svg class="icon" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4.5L6 21Z"/></svg>
            <span id="menuBookmarkLabel" class="menu-label">Bookmark this page</span>
          </button>
          <div class="menu-divider"></div>
          <button id="menuBookmarksBtn" class="menu-row" type="button">
            <svg class="icon" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4.5L6 21Z"/><path d="M9 8h6"/></svg>
            <span class="menu-label">Bookmarks</span>
            <span id="menuBookmarksCount" class="menu-meta"></span>
          </button>
          <button id="menuHistoryBtn" class="menu-row" type="button">
            <svg class="icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
            <span class="menu-label">History</span>
            <span id="menuHistoryCount" class="menu-meta"></span>
          </button>
          <button id="menuDownloadsBtn" class="menu-row" type="button">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5"/><path d="M5 21h14"/></svg>
            <span class="menu-label">Downloads</span>
          </button>
          <div class="menu-divider"></div>
          <button id="menuSettingsBtn" class="menu-row" type="button">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
            <span class="menu-label">Settings</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Site information -->
    <div id="siteInfoBackdrop" class="backdrop"></div>
    <section id="siteInfoSheet" class="sheet" role="dialog" aria-modal="true" aria-label="Site information" aria-hidden="true">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <h2 class="sheet-title">Site information</h2>
        <div class="sheet-actions">
          <button id="siteInfoCloseBtn" class="icon-btn" type="button" aria-label="Close site information">
            <svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
      </div>
      <div class="sheet-body">
        <div id="siteInfoContent" class="site-info"></div>
      </div>
    </section>

    <!-- History -->
    <section id="historyScreen" class="screen" aria-hidden="true">
      <header class="screen-header">
        <button id="historyBackBtn" class="icon-btn" type="button" aria-label="Back">
          <svg class="icon" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
        </button>
        <h1 class="screen-title">History <small id="historyCount"></small></h1>
        <button id="clearHistoryBtn" class="icon-btn" type="button" aria-label="Clear history">
          <svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
        </button>
      </header>
      <div class="search-field">
        <svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="historySearch" type="search" placeholder="Search history" autocomplete="off" />
      </div>
      <div id="historyList" class="screen-body list"></div>
    </section>

    <!-- Bookmarks -->
    <section id="bookmarksScreen" class="screen" aria-hidden="true">
      <header class="screen-header">
        <button id="bookmarksBackBtn" class="icon-btn" type="button" aria-label="Back">
          <svg class="icon" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
        </button>
        <h1 class="screen-title">Bookmarks <small id="bookmarksCount"></small></h1>
      </header>
      <div class="search-field">
        <svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="bookmarksSearch" type="search" placeholder="Search bookmarks" autocomplete="off" />
      </div>
      <div id="bookmarksList" class="screen-body list"></div>
    </section>

    <!-- Downloads -->
    <section id="downloadsScreen" class="screen" aria-hidden="true">
      <header class="screen-header">
        <button id="downloadsBackBtn" class="icon-btn" type="button" aria-label="Back">
          <svg class="icon" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
        </button>
        <h1 class="screen-title">Downloads</h1>
        <button id="downloadsRefreshBtn" class="icon-btn" type="button" aria-label="Refresh downloads">
          <svg class="icon" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.4 6.4"/><path d="M20 4v7h-7"/></svg>
        </button>
      </header>
      <div id="downloadsList" class="screen-body list"></div>
    </section>

    <!-- Settings -->
    <section id="settingsScreen" class="screen" aria-hidden="true">
      <header class="screen-header">
        <button id="settingsBackBtn" class="icon-btn" type="button" aria-label="Back">
          <svg class="icon" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
        </button>
        <h1 id="settingsTitle" class="screen-title">Settings</h1>
      </header>
      <div id="settingsRoot" class="screen-body settings-root"></div>
      <div id="settingsPage" class="screen-body settings-page" hidden></div>
    </section>

    <!-- Shared dialog -->
    <div id="dialogBackdrop" class="backdrop dialog-backdrop"></div>
    <div id="dialog" class="dialog" role="dialog" aria-modal="true" aria-hidden="true">
      <h2 id="dialogTitle" class="dialog-title"></h2>
      <p id="dialogMessage" class="dialog-message"></p>
      <div id="dialogBody" class="dialog-body"></div>
      <div class="dialog-actions">
        <button id="dialogCancel" class="btn btn-ghost" type="button">Cancel</button>
        <button id="dialogConfirm" class="btn btn-primary" type="button">OK</button>
      </div>
    </div>

    <!-- Choice sheet -->
    <div id="choiceBackdrop" class="backdrop"></div>
    <section id="choiceSheet" class="sheet" role="dialog" aria-modal="true" aria-label="Choose an option" aria-hidden="true">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <h2 id="choiceTitle" class="sheet-title">Choose an option</h2>
        <div class="sheet-actions">
          <button id="choiceClose" class="icon-btn" type="button" aria-label="Close">
            <svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
      </div>
      <div class="sheet-body flush">
        <div id="choiceList" class="choice-list"></div>
      </div>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
