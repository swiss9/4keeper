<!DOCTYPE html>
<html lang="en" class="bg-[#09090b]">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#09090b" />
  <title>4Keeper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#09090b',
            bar: '#18181b',
            line: '#27272a',
            muted: '#a1a1aa'
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    html, body { height: 100%; }
    body {
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    input { caret-color: #ffffff; }
    input::selection { background: #ffffff; color: #09090b; }
    .spin { animation: spin 700ms linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .tap { transition: opacity 120ms ease, transform 120ms ease, background-color 150ms ease; }
    .tap:active { opacity: 0.6; }
    .menu-open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
    #startScreen { transition: opacity 220ms ease; }
  </style>
</head>
<body class="flex h-[100dvh] w-full flex-col overflow-hidden bg-ink font-sans text-white antialiased">

  <header class="relative shrink-0 border-b border-line bg-bar">
    <div class="flex items-center gap-1.5 px-3 pb-2.5 pt-[calc(env(safe-area-inset-top)+10px)]">
      <svg width="24" height="24" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" fill="none" aria-label="4Keeper" class="shrink-0">
        <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" stroke="#ffffff" stroke-width="6" fill="#09090b"/>
        <rect x="30" y="30" width="25" height="10" fill="#ffffff"/>
        <polygon points="55,40 55,55 65,55 50,80 35,55 45,55 45,30 55,30" fill="#ffffff"/>
      </svg>
      <button id="backBtn" aria-label="Back" disabled class="tap grid h-10 w-10 shrink-0 place-items-center text-muted hover:text-white disabled:opacity-40">
        <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
      </button>

      <div class="flex min-w-0 flex-1 items-center gap-2 rounded-xl border border-line bg-ink px-3">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0 text-muted">
          <rect x="5" y="11" width="14" height="10" rx="2" />
          <path d="M8 11V7a4 4 0 0 1 8 0v4" />
        </svg>
        <input
          id="urlInput"
          type="url"
          inputmode="url"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="Search or enter address"
          class="h-10 w-full min-w-0 bg-transparent text-[14px] font-normal text-white outline-none placeholder:text-muted/80"
        />
      </div>

      <button id="refreshBtn" aria-label="Refresh" class="tap grid h-10 w-10 shrink-0 place-items-center text-muted hover:text-white">
        <svg id="refreshIcon" xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-3.2-6.9" />
          <path d="M21 3v6h-6" />
        </svg>
      </button>
    </div>
    <div id="loadBar" class="absolute bottom-0 left-0 h-[2px] w-0 bg-white/70 transition-[width] duration-200 ease-out"></div>
  </header>

  <main id="browser-container" class="relative min-h-0 flex-1 bg-ink">
    <div id="startScreen" class="absolute inset-0 flex flex-col items-center justify-center">
      <svg width="80" height="80" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" fill="none">
        <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" stroke="#ffffff" stroke-width="6" fill="#09090b"/>
        <rect x="30" y="30" width="25" height="10" fill="#ffffff"/>
        <polygon points="55,40 55,55 65,55 50,80 35,55 45,55 45,30 55,30" fill="#ffffff"/>
      </svg>
    </div>
  </main>

  <div id="menuBackdrop" class="pointer-events-none fixed inset-0 z-30"></div>

  <div id="menuPanel" class="fixed bottom-[calc(env(safe-area-inset-bottom)+78px)] right-3 z-40 w-56 origin-bottom-right rounded-2xl border border-line bg-bar p-1.5 opacity-0 shadow-[0_16px_48px_rgba(0,0,0,0.6)] transition-all duration-150 ease-out pointer-events-none scale-95 translate-y-1">
    <button class="tap flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left text-[14px] font-medium text-white active:bg-line/50">
      <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-muted">
        <path d="M12 3v12" />
        <path d="m7 10 5 5 5-5" />
        <path d="M5 21h14" />
      </svg>
      <span class="flex-1">Download</span>
      <span class="text-[10px] font-semibold uppercase tracking-wider text-muted/60">Phase 2</span>
    </button>
    <button class="tap flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left text-[14px] font-medium text-white active:bg-line/50">
      <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-muted">
        <path d="M13 2 4.5 13H11l-1 9 8.5-11H12l1-9Z" />
      </svg>
      <span class="flex-1">Sniff media</span>
      <span class="text-[10px] font-semibold uppercase tracking-wider text-muted/60">Phase 2</span>
    </button>
  </div>

  <footer class="relative shrink-0 border-t border-line bg-bar">
    <div class="grid grid-cols-5 px-2 pb-[calc(env(safe-area-inset-bottom)+8px)] pt-1.5">
      <button id="backNavBtn" aria-label="Back" disabled class="tap flex h-12 items-center justify-center text-muted hover:text-white disabled:opacity-40">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 19l-7-7 7-7" />
        </svg>
      </button>
      <button id="forwardBtn" aria-label="Forward" disabled class="tap flex h-12 items-center justify-center text-muted hover:text-white disabled:opacity-40">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="m9 5 7 7-7 7" />
        </svg>
      </button>
      <button id="homeBtn" aria-label="Home" class="tap flex h-12 items-center justify-center text-muted hover:text-white">
        <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 10 9-7 9 7" />
          <path d="M5 9v12h14V9" />
        </svg>
      </button>
      <button id="tabsBtn" aria-label="Tabs" class="tap relative flex h-12 items-center justify-center text-muted hover:text-white">
        <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="3" width="14" height="18" rx="2" />
          <path d="M9 3h6" />
        </svg>
        <span class="absolute right-1.5 top-1.5 grid h-[15px] min-w-[15px] place-items-center rounded-full bg-line px-1 text-[9px] font-semibold leading-none text-white">0</span>
      </button>
      <button id="menuBtn" aria-label="Menu" aria-expanded="false" class="tap flex h-12 items-center justify-center text-muted hover:text-white">
        <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="5" r="1.8" />
          <circle cx="12" cy="12" r="1.8" />
          <circle cx="12" cy="19" r="1.8" />
        </svg>
      </button>
    </div>
  </footer>

  <script>
    const menuBtn = document.getElementById('menuBtn');
    const menuPanel = document.getElementById('menuPanel');
    const menuBackdrop = document.getElementById('menuBackdrop');
    const refreshIcon = document.getElementById('refreshIcon');
    const urlInput = document.getElementById('urlInput');
    const browserContainer = document.getElementById('browser-container');
    const startScreen = document.getElementById('startScreen');
    const loadBar = document.getElementById('loadBar');
    const backBtn = document.getElementById('backBtn');
    const backNavBtn = document.getElementById('backNavBtn');
    const forwardBtn = document.getElementById('forwardBtn');

    let hasPage = false;
    let menuOpen = false;

    function getPlugin() {
      return window.Capacitor?.Plugins?.EmbeddedWebView || null;
    }

    function getBounds() {
      const rect = browserContainer.getBoundingClientRect();
      return {
        x: Math.round(rect.left),
        y: Math.round(rect.top),
        width: Math.round(rect.width),
        height: Math.round(rect.height)
      };
    }

    function setNav(canBack, canForward) {
      backBtn.disabled = !canBack;
      backNavBtn.disabled = !canBack;
      forwardBtn.disabled = !canForward;
    }

    function startLoading() {
      refreshIcon.classList.add('spin');
      loadBar.style.width = '35%';
    }

    function stopLoading() {
      refreshIcon.classList.remove('spin');
      loadBar.style.width = '100%';
      setTimeout(() => { loadBar.style.width = '0'; }, 260);
    }

    function formatUrl(input) {
      const value = input.trim();
      if (!value) return null;
      if (/^https?:\/\//i.test(value)) return value;
      if (/\s/.test(value)) return `https://duckduckgo.com/?q=${encodeURIComponent(value)}`;
      if (!value.includes('.')) return `https://duckduckgo.com/?q=${encodeURIComponent(value)}`;
      return `https://${value}`;
    }

    async function mountWebView() {
      const plugin = getPlugin();
      if (!plugin) return;
      await plugin.mount(getBounds());
    }

    async function syncNav() {
      const plugin = getPlugin();
      if (!plugin) {
        setNav(false, false);
        return;
      }
      try {
        const state = await plugin.getNavigationState();
        setNav(!!state.canGoBack, !!state.canGoForward);
      } catch (error) {
        setNav(false, false);
      }
    }

    async function navigate(raw) {
      const url = formatUrl(raw);
      if (!url) return;

      urlInput.value = url;
      urlInput.blur();
      startScreen.classList.add('opacity-0', 'pointer-events-none');
      startLoading();

      const plugin = getPlugin();
      if (!plugin) {
        stopLoading();
        console.warn('Native WebView is only available inside the Android app.');
        return;
      }

      try {
        await mountWebView();
        await plugin.loadUrl({ url });
        hasPage = true;
        syncNav();
      } catch (error) {
        console.error('Failed to load URL', error);
        stopLoading();
      }
    }

    async function goBack() {
      const plugin = getPlugin();
      if (!plugin || !hasPage) return;
      try {
        await plugin.goBack();
        setTimeout(syncNav, 350);
      } catch (error) {
        console.error(error);
      }
    }

    async function goForward() {
      const plugin = getPlugin();
      if (!plugin || !hasPage) return;
      try {
        await plugin.goForward();
        setTimeout(syncNav, 350);
      } catch (error) {
        console.error(error);
      }
    }

    async function goHome() {
      const plugin = getPlugin();
      hasPage = false;
      urlInput.value = '';
      document.title = '4Keeper';
      startScreen.classList.remove('opacity-0', 'pointer-events-none');
      setNav(false, false);
      if (plugin) {
        try {
          await plugin.setVisible({ visible: false });
        } catch (error) {
          console.error(error);
        }
      }
    }

    function setMenu(open) {
      menuOpen = open;
      menuPanel.classList.toggle('menu-open', open);
      menuBtn.setAttribute('aria-expanded', String(open));
      menuBackdrop.classList.toggle('pointer-events-auto', open);
      const plugin = getPlugin();
      if (plugin && hasPage) {
        plugin.setVisible({ visible: !open }).catch(() => {});
      }
    }

    menuBtn.addEventListener('click', () => setMenu(!menuOpen));
    menuBackdrop.addEventListener('click', () => setMenu(false));
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') setMenu(false);
    });

    document.querySelectorAll('#menuPanel button').forEach((item) => {
      item.addEventListener('click', () => setMenu(false));
    });

    urlInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        navigate(urlInput.value);
      }
    });
    urlInput.addEventListener('focus', () => urlInput.select());

    document.getElementById('refreshBtn').addEventListener('click', async () => {
      if (urlInput.value.trim()) {
        navigate(urlInput.value);
        return;
      }
      const plugin = getPlugin();
      if (plugin && hasPage) {
        startLoading();
        try {
          await plugin.reload();
        } catch (error) {
          console.error(error);
          stopLoading();
        }
      }
    });

    backBtn.addEventListener('click', goBack);
    backNavBtn.addEventListener('click', goBack);
    forwardBtn.addEventListener('click', goForward);
    document.getElementById('homeBtn').addEventListener('click', goHome);

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        const plugin = getPlugin();
        if (plugin && hasPage && !menuOpen) {
          plugin.mount(getBounds()).catch(() => {});
        }
      }, 180);
    });

    const plugin = getPlugin();
    if (plugin) {
      plugin.addListener('pageLoaded', (state) => {
        stopLoading();
        hasPage = true;
        if (state && state.url && /^https?:\/\//i.test(state.url)) urlInput.value = state.url;
        startScreen.classList.add('opacity-0', 'pointer-events-none');
        setNav(!!state?.canGoBack, !!state?.canGoForward);
      });

      plugin.addListener('pageStarted', () => startLoading());

      plugin.addListener('loadProgress', (state) => {
        if (!state || typeof state.progress !== 'number') return;
        loadBar.style.width = `${Math.min(100, Math.max(5, state.progress))}%`;
      });

      plugin.addListener('titleChanged', (state) => {
        if (state && state.title) document.title = state.title;
      });

      plugin.addListener('pageError', (state) => {
        stopLoading();
        console.error('Page error', state);
      });
    }

    syncNav();
  </script>
</body>
</html>
