<!DOCTYPE html>
<html lang="en" class="bg-[#09090b]">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#09090b" />
  <title>4Keeper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: 'var(--c-bg)',
            bar: 'var(--c-surface)',
            line: 'var(--c-border)',
            muted: 'var(--c-muted)',
            fg: 'var(--c-text)'
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <script>
    (function () {
      var t = localStorage.getItem('theme');
      if (t !== 'light' && t !== 'amoled' && t !== 'dark') t = 'dark';
      document.documentElement.classList.add('theme-' + t);
    })();
  </script>
  <style>
    :root, .theme-dark {
      --c-bg: #09090b;
      --c-surface: #18181b;
      --c-border: #27272a;
      --c-text: #ffffff;
      --c-muted: #a1a1aa;
    }
    .theme-light {
      --c-bg: #ffffff;
      --c-surface: #f4f4f5;
      --c-border: #e4e4e7;
      --c-text: #09090b;
      --c-muted: #71717a;
    }
    .theme-amoled {
      --c-bg: #000000;
      --c-surface: #0a0a0a;
      --c-border: #1a1a1a;
      --c-text: #ffffff;
      --c-muted: #a1a1aa;
    }
    html, body { height: 100%; }
    body {
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    input { caret-color: var(--c-text); }
    input::selection { background: var(--c-text); color: var(--c-bg); }
    .spin { animation: spin 700ms linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .tap { transition: opacity 120ms ease, transform 120ms ease, background-color 150ms ease; }
    .tap:active { opacity: 0.6; }
    #menuPanel.menu-open {
      opacity: 1 !important;
      transform: translateY(0) scale(1) !important;
      pointer-events: auto !important;
    }
    #startScreen { transition: opacity 220ms ease; }
    #settings-view { display: none; }
    #settings-view.settings-open { display: flex; }
    .theme-active {
      background: var(--c-text) !important;
      color: var(--c-bg) !important;
      font-weight: 600;
    }
    #tabsPanel { transition: transform 200ms ease; }
    #tabsPanel.tabs-open { transform: translateY(0) !important; }
  </style>
</head>
<body class="h-[100dvh] w-full overflow-hidden bg-ink font-sans text-fg antialiased">

  <div id="main-view" class="flex h-full w-full flex-col overflow-hidden">

  <header class="relative shrink-0 border-b border-line bg-bar">
    <div class="flex items-center gap-1.5 px-3 pb-2.5 pt-[calc(env(safe-area-inset-top)+10px)]">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="234 227 777 777"
        fill="none"
        aria-label="4Keeper"
        class="shrink-0 self-center"
      >
        <!-- Grey shield outline -->
        <path
          fill="#99989E"
          fill-rule="evenodd"
          d="
            M310 227
            H936
            V736
            L623 1004
            L309 736
            Z

            M360 273
            V715
            L623 939
            L889 715
            V273
            Z
          "
        />

        <!-- White number 4 with downward arrow -->
        <path
          fill="#FFFFFF"
          fill-rule="evenodd"
          d="
            M619 322
            L407 550
            V615
            H641
            L642 706
            H568
            L680 834
            L799 707
            L733 705
            V617
            L797 615
            V557
            L733 555
            V323
            H734
            Z

            M641 392
            L642 556
            L492 557
            Z
          "
        />
      </svg>
      <button id="backBtn" aria-label="Back" disabled class="tap grid h-10 w-10 shrink-0 place-items-center text-muted hover:text-fg disabled:opacity-40">
        <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
      </button>

      <div class="flex min-w-0 flex-1 items-center gap-2 border-2 border-[#27272a] bg-ink px-3 py-2 transition-colors duration-150 focus-within:border-zinc-600">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0 text-[#a1a1aa]">
          <rect x="5" y="11" width="14" height="10" rx="2" />
          <path d="M8 11V7a4 4 0 0 1 8 0v4" />
        </svg>
        <input
          id="urlInput"
          type="url"
          inputmode="url"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="Search or enter address"
          class="h-6 w-full min-w-0 bg-transparent text-[14px] font-normal text-fg outline-none placeholder:text-[#a1a1aa]"
        />
      </div>

      <button id="refreshBtn" aria-label="Refresh" class="tap grid h-10 w-10 shrink-0 place-items-center text-muted hover:text-fg">
        <svg id="refreshIcon" xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-3.2-6.9" />
          <path d="M21 3v6h-6" />
        </svg>
      </button>
    </div>
    <div id="loadBar" class="absolute bottom-0 left-0 h-[2px] w-0 bg-fg transition-[width] duration-200 ease-out"></div>

    <div id="suggestionsDropdown" class="absolute left-0 right-0 top-full z-50 hidden border-b border-line bg-bar shadow-[0_16px_48px_rgba(0,0,0,0.6)]">
      <div id="suggestionsList" class="max-h-64 overflow-y-auto"></div>
    </div>
  </header>

  <main id="browser-container" class="relative min-h-0 flex-1 bg-ink">
    <div id="startScreen" class="absolute inset-0 flex flex-col items-center justify-center">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="80"
        height="80"
        viewBox="234 227 777 777"
        fill="none"
      >
        <!-- Grey shield outline -->
        <path
          fill="#99989E"
          fill-rule="evenodd"
          d="
            M310 227
            H936
            V736
            L623 1004
            L309 736
            Z

            M360 273
            V715
            L623 939
            L889 715
            V273
            Z
          "
        />

        <!-- White number 4 with downward arrow -->
        <path
          fill="#FFFFFF"
          fill-rule="evenodd"
          d="
            M619 322
            L407 550
            V615
            H641
            L642 706
            H568
            L680 834
            L799 707
            L733 705
            V617
            L797 615
            V557
            L733 555
            V323
            H734
            Z

            M641 392
            L642 556
            L492 557
            Z
          "
        />
      </svg>
    </div>
  </main>

  <div id="menuBackdrop" class="pointer-events-none fixed inset-0 z-30"></div>

  <div id="menuPanel" class="fixed bottom-[calc(env(safe-area-inset-bottom)+78px)] right-3 z-40 w-56 origin-bottom-right rounded-2xl border border-line bg-bar p-1.5 opacity-0 shadow-[0_16px_48px_rgba(0,0,0,0.6)] transition-all duration-150 ease-out pointer-events-none scale-95 translate-y-1">
    <button class="tap flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left text-[14px] font-medium text-fg active:bg-line">
      <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-muted">
        <path d="M12 3v12" />
        <path d="m7 10 5 5 5-5" />
        <path d="M5 21h14" />
      </svg>
      <span class="flex-1">Download</span>
      <span class="text-[10px] font-semibold uppercase tracking-wider text-muted/60">Phase 2</span>
    </button>
    <button class="tap flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left text-[14px] font-medium text-fg active:bg-line">
      <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-muted">
        <path d="M13 2 4.5 13H11l-1 9 8.5-11H12l1-9Z" />
      </svg>
      <span class="flex-1">Sniff media</span>
      <span class="text-[10px] font-semibold uppercase tracking-wider text-muted/60">Phase 2</span>
    </button>
    <button id="settingsBtn" class="tap flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left text-[14px] font-medium text-fg active:bg-line">
      <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-muted">
        <circle cx="12" cy="12" r="3" />
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" />
      </svg>
      <span class="flex-1">Settings</span>
    </button>
  </div>

  <div id="tabsBackdrop" class="pointer-events-none fixed inset-0 z-[65] bg-black/60 opacity-0 transition-opacity duration-200"></div>

  <div id="tabsPanel" class="fixed inset-x-0 bottom-0 z-[66] max-h-[75dvh] translate-y-full overflow-y-auto rounded-t-2xl border-t border-line bg-bar pb-[calc(env(safe-area-inset-bottom)+12px)] shadow-[0_-16px_48px_rgba(0,0,0,0.6)]">
    <div class="flex items-center justify-between border-b border-line px-4 py-3">
      <h2 class="text-[13px] font-semibold uppercase tracking-wider text-fg">Tabs</h2>
      <div class="flex items-center gap-2">
        <button id="newTabBtn" aria-label="New tab" class="tap grid h-8 w-8 place-items-center border border-line text-fg hover:bg-line/40">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12h14" />
          </svg>
        </button>
        <button id="tabsCloseBtn" aria-label="Close tabs" class="tap grid h-8 w-8 place-items-center border border-line text-muted hover:text-fg">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>
      </div>
    </div>
    <div class="p-3">
      <div id="tabsList" class="flex flex-col gap-2"></div>
    </div>
  </div>

  <footer class="relative shrink-0 border-t border-line bg-bar">
    <div class="grid grid-cols-5 px-2 pb-[calc(env(safe-area-inset-bottom)+8px)] pt-1.5">
      <button id="backNavBtn" aria-label="Back" disabled class="tap flex h-12 items-center justify-center text-muted hover:text-fg disabled:opacity-40">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 19l-7-7 7-7" />
        </svg>
      </button>
      <button id="forwardBtn" aria-label="Forward" disabled class="tap flex h-12 items-center justify-center text-muted hover:text-fg disabled:opacity-40">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="m9 5 7 7-7 7" />
        </svg>
      </button>
      <button id="homeBtn" aria-label="Home" class="tap flex h-12 items-center justify-center text-muted hover:text-fg">
        <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 10 9-7 9 7" />
          <path d="M5 9v12h14V9" />
        </svg>
      </button>
      <button id="tabsBtn" aria-label="Tabs" class="tap relative flex h-12 items-center justify-center text-muted hover:text-fg">
        <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="3" width="14" height="18" rx="2" />
          <path d="M9 3h6" />
        </svg>
        <span id="tabsCount" class="absolute right-1.5 top-1.5 grid h-[15px] min-w-[15px] place-items-center rounded-full bg-fg px-1 text-[9px] font-semibold leading-none text-[#09090b]">0</span>
      </button>
      <button id="menuBtn" aria-label="Menu" aria-expanded="false" class="tap flex h-12 items-center justify-center text-muted hover:text-fg">
        <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="5" r="1.8" />
          <circle cx="12" cy="12" r="1.8" />
          <circle cx="12" cy="19" r="1.8" />
        </svg>
      </button>
    </div>
  </footer>

  </div>

  <div id="settings-view" class="h-full w-full flex-col overflow-y-auto bg-ink text-fg">
    <div class="sticky top-0 z-10 flex shrink-0 items-center gap-2 border-b border-line bg-bar px-3 pb-2.5 pt-[calc(env(safe-area-inset-top)+10px)]">
      <button id="settingsBackBtn" aria-label="Back" class="tap flex h-10 shrink-0 items-center gap-1.5 border border-line px-3 font-mono text-[12px] font-semibold uppercase tracking-wider text-fg hover:bg-line/40">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 19l-7-7 7-7" />
        </svg>
        BACK
      </button>
      <h1 class="flex flex-1 items-center justify-center gap-2 text-center font-mono text-[13px] font-bold uppercase tracking-[0.25em] text-fg">
        <span class="h-1.5 w-1.5 shrink-0 bg-fg" aria-hidden="true"></span>
        Settings
      </h1>
      <div class="h-10 w-[76px] shrink-0" aria-hidden="true"></div>
    </div>

    <div>
      <div class="border-b border-line bg-bar/70 px-4 py-2">
        <span class="font-mono text-[11px] font-semibold uppercase tracking-[0.2em] text-muted">// GENERAL</span>
      </div>
      <div class="grid grid-cols-1 gap-2 border-b border-line p-3 sm:grid-cols-2 sm:gap-3">
        <div class="border border-line bg-bar/40 p-3">
          <label for="searchEngineSelect" class="mb-2 block font-mono text-[11px] font-semibold uppercase tracking-wider text-muted">Search Engine</label>
          <select id="searchEngineSelect" class="h-10 w-full border border-line bg-ink px-3 text-[14px] font-medium text-fg outline-none focus:border-zinc-600">
            <option value="duckduckgo">DuckDuckGo</option>
            <option value="google">Google</option>
            <option value="brave">Brave</option>
            <option value="bing">Bing</option>
          </select>
        </div>
        <div class="border border-line bg-bar/40 p-3">
          <label for="homePageInput" class="mb-2 block font-mono text-[11px] font-semibold uppercase tracking-wider text-muted">Home Page</label>
          <input
            id="homePageInput"
            type="url"
            inputmode="url"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="https://www.google.com"
            class="h-10 w-full border border-line bg-ink px-3 font-mono text-[13px] font-medium text-fg outline-none focus:border-zinc-600 placeholder:text-muted"
          />
        </div>
      </div>

      <div class="border-b border-line bg-bar/70 px-4 py-2">
        <span class="font-mono text-[11px] font-semibold uppercase tracking-[0.2em] text-muted">// APPEARANCE</span>
      </div>
      <div class="grid grid-cols-1 gap-2 border-b border-line p-3 sm:grid-cols-2 sm:gap-3">
        <div class="border border-line bg-bar/40 p-3 sm:col-span-2">
          <span class="mb-2 block font-mono text-[11px] font-semibold uppercase tracking-wider text-muted">App Theme</span>
          <div id="themeSelector" class="grid grid-cols-3 gap-0 border border-line">
            <button data-theme="light" class="tap h-10 border-r border-line text-[13px] font-medium text-fg">Light</button>
            <button data-theme="dark" class="tap h-10 border-r border-line text-[13px] font-medium text-fg">Dark</button>
            <button data-theme="amoled" class="tap h-10 text-[13px] font-medium text-fg">AMOLED</button>
          </div>
        </div>
        <div class="flex items-center justify-between border border-line bg-bar/40 p-3 sm:col-span-2">
          <div class="min-w-0 pr-3">
            <span class="block text-[14px] font-medium text-fg">Web Dark Mode</span>
            <span class="block text-[11px] text-muted">Force websites to render in dark mode</span>
          </div>
          <label class="relative inline-block shrink-0 cursor-pointer">
            <input id="webDarkModeToggle" type="checkbox" class="peer sr-only" />
            <span class="block h-6 w-11 border border-line bg-ink"></span>
            <span class="pointer-events-none absolute left-[3px] top-[3px] h-4 w-4 bg-muted transition-transform duration-100 peer-checked:translate-x-5 peer-checked:bg-fg"></span>
          </label>
        </div>
      </div>

      <div class="border-b border-line bg-bar/70 px-4 py-2">
        <span class="font-mono text-[11px] font-semibold uppercase tracking-[0.2em] text-muted">// PRIVACY &amp; SECURITY</span>
      </div>
      <div class="grid grid-cols-1 gap-2 border-b border-line p-3 sm:grid-cols-2 sm:gap-3">
        <div class="flex items-center justify-between border border-line bg-bar/40 p-3">
          <div class="min-w-0 pr-3">
            <span class="block text-[14px] font-medium text-fg">Ad-Blocker</span>
            <span class="block text-[11px] text-muted">Block ads and trackers (coming soon)</span>
          </div>
          <label class="relative inline-block shrink-0 cursor-pointer">
            <input id="adBlockerToggle" type="checkbox" class="peer sr-only" />
            <span class="block h-6 w-11 border border-line bg-ink"></span>
            <span class="pointer-events-none absolute left-[3px] top-[3px] h-4 w-4 bg-muted transition-transform duration-100 peer-checked:translate-x-5 peer-checked:bg-fg"></span>
          </label>
        </div>
        <div class="border border-line bg-bar/40 p-3">
          <button id="clearDataBtn" class="tap h-11 w-full border border-red-600 font-mono text-[12px] font-semibold uppercase tracking-wider text-red-600 hover:bg-red-600/10">
            Clear Browsing Data
          </button>
          <span class="mt-2 block text-[11px] text-muted">Removes history, cache, cookies and saved session</span>
        </div>
      </div>

      <div class="border-b border-line bg-bar/70 px-4 py-2">
        <span class="font-mono text-[11px] font-semibold uppercase tracking-[0.2em] text-muted">// SEARCH</span>
      </div>
      <div class="grid grid-cols-1 gap-2 border-b border-line p-3 sm:grid-cols-2 sm:gap-3">
        <div class="flex items-center justify-between border border-line bg-bar/40 p-3 sm:col-span-2">
          <div class="min-w-0 pr-3">
            <span class="block text-[14px] font-medium text-fg">Search Suggestions</span>
            <span class="block text-[11px] text-muted">Show query suggestions while typing</span>
          </div>
          <label class="relative inline-block shrink-0 cursor-pointer">
            <input id="searchSuggestionsToggle" type="checkbox" class="peer sr-only" />
            <span class="block h-6 w-11 border border-line bg-ink"></span>
            <span class="pointer-events-none absolute left-[3px] top-[3px] h-4 w-4 bg-muted transition-transform duration-100 peer-checked:translate-x-5 peer-checked:bg-fg"></span>
          </label>
        </div>
      </div>

      <div class="h-6"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
